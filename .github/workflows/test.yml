name: Run Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/VideoProcessor.csproj

      - name: Build backend
        run: dotnet build backend/VideoProcessor.csproj --no-restore --configuration Release

  health-check:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker-compose up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5000/health && curl -f http://localhost:3000; then
              echo "Services are healthy"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for services..."
            sleep 2
          done
          exit 1

      - name: Check backend health
        run: curl -f http://localhost:5000/health

      - name: Cleanup
        if: always()
        run: docker-compose down -v
